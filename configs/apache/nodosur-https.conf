<VirtualHost *:443>
    ServerName nodosur07.tas
    ServerAlias www.nodosur07.tas
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/nodosur07.crt
    SSLCertificateKeyFile /etc/ssl/private/nodosur58/nodosur07.key

    ErrorLog ${APACHE_LOG_DIR}/nodosur_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/nodosur_ssl_access.log combined
</VirtualHost>
